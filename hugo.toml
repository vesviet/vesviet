baseURL = "https://tanhdev.com/"
locale = "en-us"
defaultContentLanguage = "en"
title = "Lê Tuấn Anh: Senior Software Engineer · Backend & Platform Specialist"
theme = "PaperMod"
enableRobotsTXT = false  # static/robots.txt in /static takes precedence; explicit AI bot rules defined there
buildFuture = true

[params.assets]
favicon = "/favicon.ico"
apple_touch_icon = "/apple-touch-icon.png"
[pagination]
  pagerSize = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    useClasses = true



[permalinks]
  posts = "/posts/:slug/"
  radar = "/radar/:sections[1]/:slug/"

[params]
  env = "production"
  images = ["/vesviet.png"]
  description = "Senior Software Engineer · Backend & Platform Specialist with 17+ years experience building scalable platforms, Golang microservices, and e-commerce systems."
  author = "Lê Tuấn Anh"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = true

[params.label]
  text = "Lê Tuấn Anh"


[params.cover]
  hidden = false           # show cover images
  hiddenInList = true      # hide on homepage / list pages — keep list clean
  hiddenInSingle = false   # show on individual post pages
  responsiveImages = true  # generate srcset for performance
  
[params.profileMode]
  enabled = true
  title = "Lê Tuấn Anh: Senior Software Engineer · Backend & Platform Specialist"
  subtitle = """<span style="font-size: 1.1em;">**Backend Architecture & Platform Specialist**</span><br><br>17+ years building resilient, scalable platforms in Vietnam and beyond.<div class="exp-list"><div class="exp-item">🚀 **17+ Years Experience** (Building scalable web & distributed systems since 2008)</div><div class="exp-item">⚡ **PHP Monolith → Go Microservices** (-35% API latency, zero-downtime EKS at Vigo Retail)</div><div class="exp-item">📦 **21+ Services Architecture** (Personal Composable Commerce Platform with Go, K3s, Dapr)</div></div>"""
  imageUrl = "vesviet.png"
  imageTitle = "Le Tuan Anh - Senior Software Engineer and Backend Architecture Specialist"
  imageWidth = 120
  imageHeight = 120

  buttons = [
    { name = "🤝 Hire Me / Consulting", url = "/hire/", style = "primary" },
    { name = "📧 Contact Me", url = "mailto:vesviet@gmail.com", style = "primary" },
    { name = "My Resume", url = "/Le-Tuan-Anh-Resume.pdf", style = "secondary" },
    { name = "LinkedIn", url = "https://www.linkedin.com/in/vesviet", style = "secondary" },
    { name = "GitHub", url = "https://github.com/vesviet", style = "secondary" }
  ]

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "My Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "series"
    name = "Series"
    url = "/series/"
    weight = 12
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 14
  [[menu.main]]
    identifier = "radar"
    name = "Tech Radar"
    url = "/radar/"
    weight = 15
  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "hire"
    name = "Hire Me"
    url = "/hire/"
    weight = 25
  [[menu.main]]
    identifier = "external"
    name = "Resources"
    weight = 30
  [[menu.main]]
    parent = "external"
    identifier = "reading-map"
    name = "Reading Map"
    url = "/reading-map/"
    weight = 5
  [[menu.main]]
    parent = "external"
    identifier = "tools"
    name = "Dev Tools"
    url = "https://it-tools.tanhdev.com/"
    weight = 10
  [[menu.main]]
    parent = "external"
    identifier = "wiki"
    name = "Wiki"
    url = "https://wiki.tanhdev.com/"
