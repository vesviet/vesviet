  [[menu.footer]]
    identifier = "privacy"
    name = "Privacy Policy"
    url = "/privacy-policy/"
    weight = 10
  [[menu.footer]]
    identifier = "terms"
    name = "Terms of Service"
    url = "/terms-of-service/"
