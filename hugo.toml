[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    isHTML = false
  [outputFormats.llms-full]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    isHTML = false

[outputs]
  home = ["HTML", "RSS", "llms", "llms-full"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[taxonomies]
  category = "categories"
  tag = "tags"

[sitemap]
  changefreq = "weekly"
  priority = 0.8
  filename = "sitemap.xml"

